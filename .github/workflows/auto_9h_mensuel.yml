name: 🚀 Fastlane - Générateur Manuel (63 Publications)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'last_run.txt'

jobs:
  lancement_simultane:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        categorie: [SKIN, MICOSE, MINCY, VARICES, VITILIGHO, EMMEROIDE, ARTHROSE, NEXORA]
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🐍 Installation Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔓 Déchiffrement des 21 profils
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in accounts.enc -out accounts.tar.gz -pass pass:"Fastlane2026"
          tar -xzf accounts.tar.gz
          ls -la Profil_*.json | head -n 5

      - name: 🎭 Installation navigateur
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 💬 Envoi Commentaires (${{ matrix.categorie }} - 20 comm x 40s - Proxy TN)
        env:
          PROXY_TN: "http://Oy44RYiT2xPWmMrZ:iOF0ptf2RbPGbyVq_country-tn@geo.iproyal.com:12321"
          PYTHONUNBUFFERED: "1"
        run: |
          sleep $((RANDOM % 10))
          python3 -u auto_daily_bot.py "${{ matrix.categorie }}" || true
