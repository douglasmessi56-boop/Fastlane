name: Fastlane 20 Commentaires Par Post (08h25 & 20h25)
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * *'
    - cron: '25 19 * * *'

concurrency:
  group: fastlane-campaign-matrix
  cancel-in-progress: true

jobs:
  campagne_parallele:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        categorie: [SKIN, MICOSE, MINCY, VARICES, VERRUES, ARTHROSE, DETOX, EMMEROIDE]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Decrypt accounts
        run: |
          if [ -f accounts.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in accounts.enc -out accounts.tar.gz -pass pass:"${{ secrets.ACCOUNTS_PASSWORD }}" 2>/dev/null || openssl enc -d -aes-256-cbc -pbkdf2 -in accounts.enc -out accounts.tar.gz -pass pass:"Fastlane2026"
            tar -xzf accounts.tar.gz
          fi

      - name: Lancement ${{ matrix.categorie }} (21 profils x Publications)
        env:
          PROXY_TN: ${{ secrets.PROXY_TN }}
        run: |
          python3 -u check_and_report.py && python3 -u auto_daily_bot.py ${{ matrix.categorie }}
