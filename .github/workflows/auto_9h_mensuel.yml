name: 🚀 Fastlane - Générateur Manuel (63 Publications)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      produit:
        description: 'Choisir ALL pour lancer les 8 produits simultanément (63 publications)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - SKIN
          - VARIS
          - MICOSE
          - ARTHROSE
          - MINCY
          - HEMMEROIDE
          - WHITE_BLOOM
          - AUTRE

jobs:
  lancement_simultane:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        categorie: [SKIN, VARIS, MICOSE, ARTHROSE, MINCY, HEMMEROIDE, WHITE_BLOOM, AUTRE]
    steps:
      - name: 📥 Récupération du code
        if: ${{ github.event.inputs.produit == 'ALL' || github.event.inputs.produit == matrix.categorie || github.event.inputs.produit == '' }}
        uses: actions/checkout@v4

      - name: 🐍 Installation Python
        if: ${{ github.event.inputs.produit == 'ALL' || github.event.inputs.produit == matrix.categorie || github.event.inputs.produit == '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔓 Déchiffrement des 21 profils
        if: ${{ github.event.inputs.produit == 'ALL' || github.event.inputs.produit == matrix.categorie || github.event.inputs.produit == '' }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in accounts.enc -out accounts.tar.gz -pass pass:"Fastlane2026"
          tar -xzf accounts.tar.gz

      - name: 🎭 Installation navigateur
        if: ${{ github.event.inputs.produit == 'ALL' || github.event.inputs.produit == matrix.categorie || github.event.inputs.produit == '' }}
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 💬 Envoi Commentaires (${{ matrix.categorie }} - 40s écart - Proxy TN)
        if: ${{ github.event.inputs.produit == 'ALL' || github.event.inputs.produit == matrix.categorie || github.event.inputs.produit == '' }}
        env:
          PROXY_TN: ${{ secrets.PROXY_TN }}
          PYTHONUNBUFFERED: "1"
        run: |
          sleep $((RANDOM % 10))
          python3 -u auto_daily_bot.py "${{ matrix.categorie }}"
